name: iOS build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/CAAccountsNotebook
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build -project CAAccountsNotebook.xcodeproj -scheme CAAccountsNotebook
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
